<style>
:root{color-scheme:dark;--bg:#080d1a;--ink:#e8ecf7;--mute:#93a0c0;--panel:#0f1830;--p2:#16234a;--gold:#ffb547;--gd:#8a6220;--cy:#4de3d0;--mg:#ff5d8f;--line:#2a3a68;
--serif:"Cinzel",Georgia,"Times New Roman",serif;--sans:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#080d1a radial-gradient(1100px 520px at 50% -10%,#18274f,#080d1a);color:var(--ink);font:16px/1.6 var(--sans);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.wrap{max-width:1000px;margin:0 auto;padding:14px}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;padding:12px 18px;background:linear-gradient(180deg,var(--p2),var(--panel));border:1px solid var(--gd);box-shadow:inset 0 0 0 4px var(--panel),inset 0 0 0 5px var(--gd),0 10px 30px rgba(0,0,0,.5)}
.crest{width:46px;height:52px;flex:none}
.who{margin-right:auto}
h1{margin:0;font:800 22px/1.1 var(--serif);letter-spacing:.06em}
.who small{color:var(--mute);font-size:13px}
.lvl{width:38px;height:38px;rotate:45deg;background:var(--gold);color:#1a1205;display:grid;place-items:center;border:2px solid #fff3d6}
.lvl b{rotate:-45deg;font:800 16px var(--serif)}
.xp{display:grid;gap:3px;min-width:150px;font-size:12px;color:var(--mute)}
.bar{height:12px;border:1px solid var(--gd);background:#070b16;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--gd),var(--gold));transition:width .6s}
.bar:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 13px,#070b16 13px 15px)}
.tro{display:flex;gap:8px}
.tro span{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);color:#4b5a86;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#0a1122;transition:.4s}
.tro span.on{color:#1a1205;background:var(--gold)}
#world{position:relative;margin-top:16px;height:min(66vh,540px);min-height:360px;overflow:hidden;cursor:crosshair;border:1px solid var(--gd);box-shadow:inset 0 0 0 4px var(--bg),inset 0 0 0 5px var(--gd),0 14px 40px rgba(0,0,0,.55);background:#0b2229}
#ground{position:absolute;inset:0;width:100%;height:100%}
.rd{stroke-dasharray:7 11;animation:fl 2.2s linear infinite}
@keyframes fl{to{stroke-dashoffset:-36}}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(3,6,14,.75))}
.dec{position:absolute;transform:translate(-50%,-85%);pointer-events:none}
.ff{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffe2a8;box-shadow:0 0 9px 3px rgba(255,181,71,.55);pointer-events:none;animation:fly 5s ease-in-out infinite alternate}
@keyframes fly{to{transform:translate(28px,-22px);opacity:.25}}
.loc{position:absolute;transform:translate(-50%,-64%);background:none;border:0;padding:0;display:grid;justify-items:center;gap:2px;transition:transform .25s,filter .25s;z-index:2}
.loc svg.b{width:clamp(70px,10vw,104px);height:auto;overflow:visible}
.nm{font:700 12px/1 var(--serif);letter-spacing:.06em;background:#0a1122ee;border:1px solid var(--gd);padding:5px 9px;white-space:nowrap}
.loc.near{transform:translate(-50%,-68%) scale(1.07);filter:drop-shadow(0 0 14px rgba(255,181,71,.75))}
.loc.near .nm{background:var(--gold);color:#1a1205}
.q{position:absolute;top:-16px;right:6px;width:22px;height:26px;animation:bob 1s ease-in-out infinite}
.loc.done .q{display:none}
.glow .b{animation:gl 1.4s infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes gl{50%{filter:drop-shadow(0 0 16px var(--cy))}}
#pl{position:absolute;left:50%;top:88%;width:38px;transform:translate(-50%,-88%);transition:left .12s linear,top .12s linear;pointer-events:none;z-index:4}
#pl svg{width:100%;height:auto;overflow:visible;animation:wk .7s ease-in-out infinite alternate}
@keyframes wk{to{transform:translateY(-3px)}}
.hint{margin:12px 2px;color:var(--mute);font-size:15px;min-height:1.6em}.hint b{color:var(--gold);font-weight:500}
.pad{display:none;gap:8px;justify-content:center}
.pad button{width:54px;height:54px;background:var(--panel);border:1px solid var(--gd);touch-action:manipulation;font-weight:700}
@media (hover:none){.pad{display:flex}}
#ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(3,6,14,.78);backdrop-filter:blur(3px)}
#ov[hidden]{display:none}
#ov section{width:min(740px,100%);max-height:88vh;overflow:auto;background:linear-gradient(180deg,var(--p2),var(--panel) 120px);border:1px solid var(--gd);box-shadow:inset 0 0 0 4px var(--panel),inset 0 0 0 5px var(--gd),0 20px 60px #000}
#ov header{display:flex;justify-content:space-between;align-items:center;padding:16px 22px 12px;position:sticky;top:0;background:var(--p2);border-bottom:1px solid var(--gd)}
h2{margin:0;font:800 19px var(--serif);letter-spacing:.06em}
#x{width:38px;height:38px;background:none;border:1px solid var(--line);display:grid;place-items:center}
#pb{padding:20px 24px 26px}
#pb p{margin:0 0 14px;max-width:62ch}
.tl{list-style:none;margin:18px 0 0;padding:0 0 0 20px;border-left:1px solid var(--gd)}
.tl li{position:relative;margin:0 0 16px}
.tl li:before{content:"";position:absolute;left:-26px;top:7px;width:10px;height:10px;rotate:45deg;background:var(--gold)}
.tl b{display:block;font-family:var(--serif);letter-spacing:.03em}.tl span{color:var(--mute);font-size:14px}
.sks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.sk{text-align:left;background:#0a1122;border:1px solid var(--line);padding:12px 14px}
.sk:hover{border-color:var(--cy)}.sk b{font-family:var(--serif);letter-spacing:.04em}
.pips{display:flex;gap:6px;margin-top:8px}
.pips i{width:16px;height:16px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:#1a2650;transition:background .3s}
.pips i.on{background:var(--cy)}
#sn{margin-top:14px;min-height:3em;color:var(--mute)}#sn b{color:var(--ink)}
.pj{border:1px solid var(--line);margin-bottom:10px;background:#0a1122}
.pj.open{border-color:var(--gd)}
.pj>button{width:100%;display:flex;gap:14px;align-items:center;text-align:left;background:none;border:0;padding:14px}
.pj .e{width:44px;height:44px;display:grid;place-items:center;color:var(--gold);border:1px solid var(--gd);font-size:22px;flex:none}
.pj strong{display:block;font-family:var(--serif);letter-spacing:.04em}.pj small{color:var(--mute)}
.pj .d{display:none;padding:0 16px 16px 72px}.pj.open .d{display:block}
.boss{display:inline-flex;gap:8px;align-items:center;color:var(--mg);font-size:14px;font-weight:700}
.cta{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:10px;background:var(--gold);color:#1a1205;text-decoration:none;font-weight:700;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.cta.alt{background:var(--p2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--gd)}
.cta button{margin-left:auto;background:#1a1205;color:var(--gold);border:0;padding:5px 12px;font-size:14px}
#toasts{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:grid;gap:8px;z-index:20}
.t{background:var(--panel);color:var(--ink);border:1px solid var(--gold);border-left:4px solid var(--gold);padding:9px 14px;font-weight:500;animation:pop .3s;box-shadow:0 8px 24px #000a}
@keyframes pop{from{transform:translateX(30px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const Z={
home:{nm:"Vila",title:"Vila · Sobre mim",x:12,y:62,html:()=>`<p>Oi! Eu sou o <b>Felipe</b>, 24 anos, formado em Análise e Desenvolvimento de Sistemas. Gosto de transformar tarefa repetitiva em automação e de resolver problema de gente de verdade, seja no código ou no atendimento.</p><p>Hoje sou secretário e conferente na Receita Federal e estou aberto a novas missões em suporte, atendimento e automação.</p>
<ul class="tl"><li><b>Receita Federal (via Avantt)</b><span>Secretário e conferente · 2026 – atual</span></li><li><b>Autônomo</b><span>Consultoria e automações para empresas com excesso de trabalho manual · 2024 – 2025</span></li><li><b>Cometa Network</b><span>Suporte técnico · 2022 – 2023</span></li><li><b>Lojas Pernambucanas</b><span>Vendedor · 2021</span></li></ul>`},
skills:{nm:"Árvore de Skills",title:"Árvore de Skills",x:32,y:24,html:()=>`<p>Toque em uma habilidade para ver o nível e um detalhe.</p><div class="sks">${SKILLS.map((s,i)=>`<button class="sk" data-i="${i}"><b>${s[0]}</b><div class="pips">${"<i></i>".repeat(5)}</div></button>`).join("")}</div><div id="sn"></div>`,
bind(){document.querySelectorAll(".sk").forEach(b=>b.onclick=()=>{const s=SKILLS[b.dataset.i];b.querySelectorAll("i").forEach((p,j)=>{p.style.transitionDelay=j*90+"ms";p.classList.toggle("on",j<s[1])});$("#sn").innerHTML=`<b>${s[0]} · nível ${s[1]}/5</b><br>${s[2]}`;if(!S.sk.has(s[0])){S.sk.add(s[0]);xp(2);if(S.sk.size===SKILLS.length)unlock("trainer")}})}},
proj:{nm:"Masmorra de Projetos",title:"Masmorra de Projetos",x:58,y:58,html:()=>`<p>Quatro fases já vencidas. Abra cada uma para ver o chefe.</p>${PROJ.map((p,i)=>`<div class="pj" data-i="${i}"><button aria-expanded="false"><span class="e">${ic(p[0])}</span><span><strong>${p[1]}</strong><small>${p[2]}</small></span></button><div class="d"><p>${p[3]}</p><span class="boss">${ic("sword")} ${p[4]}</span></div></div>`).join("")}`,
bind(){document.querySelectorAll(".pj>button").forEach(b=>b.onclick=()=>{const c=b.parentNode,o=c.classList.toggle("open");b.setAttribute("aria-expanded",o);if(o&&!S.pj.has(c.dataset.i)){S.pj.add(c.dataset.i);xp(3);if(S.pj.size>=3)unlock("coder")}})}},
edu:{nm:"Academia",title:"Academia · Formação",x:78,y:22,html:()=>`<ul class="tl"><li><b>Análise e Desenvolvimento de Sistemas</b><span>Unipar · formado em 2024</span></li><li><b>Cursos complementares (Udemy)</b><span>Java, JavaScript, Python, Oratória, Marketing e Pacote Office completo</span></li><li><b>Inglês avançado</b><span>Leitura técnica, escrita e conversação</span></li></ul>`},

const TRO={explorer:["compass","Explorador: visitou os 5 locais"],coder:["sword","Caçador de chefes: abriu 3 projetos"],trainer:["rune","Treinador: testou todas as skills"],hero:["crown","Contato feito"]};
const S={x:0,seen:new Set(),sk:new Set(),pj:new Set(),got:new Set(),lv:1};let pos={x:50,y:90},near=null,timer;

[["pine",4,16,34],["pine",8,40,30],["pine",24,90,38],["pine",44,36,30],["pine",66,92,34],["pine",95,34,36],["pine",93,92,30],["pine",3,92,32],["pine",70,44,26],["lamp",22,66,22],["lamp",46,72,22],["lamp",68,74,22],["lamp",84,52,22],["rock",20,42,30],["rock",92,52,26],["rock",56,16,26],["rock",38,84,24]].forEach(d=>{const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("class","dec");s.setAttribute("viewBox",d[0]=="pine"?"0 0 32 46":d[0]=="lamp"?"0 0 20 44":"0 0 30 20");s.style.cssText=`left:${d[1]}%;top:${d[2]}%;width:${d[3]}px;height:${d[3]*(d[0]=="pine"?1.44:d[0]=="lamp"?2.2:.67)}px`;s.innerHTML=`<use href="#${d[0]}"/>`;W.append(s)});
for(let i=0;i<10;i++){const f=document.createElement("i");f.className="ff";f.style.cssText=`left:${5+Math.random()*90}%;top:${10+Math.random()*80}%;animation-delay:-${Math.random()*5}s;animation-duration:${4+Math.random()*4}s`;W.append(f)}
Object.entries(Z).forEach(([k,z])=>{const b=document.createElement("button");b.className="loc";b.dataset.k=k;b.style.left=z.x+"%";b.style.top=z.y+"%";b.innerHTML=`${B[k]}<span class="nm">${z.nm}</span><svg class="q" aria-hidden="true"><use href="#q"/></svg>`;b.onclick=()=>go(k);W.append(b)});
$("#tro").innerHTML=Object.entries(TRO).map(([k,t])=>`<span id="t-${k}" title="${t[1]}">${ic(t[0])}</span>`).join("");

function toast(m){const t=document.createElement("div");t.className="t";t.textContent=m;$("#toasts").append(t);setTimeout(()=>t.remove(),3400)}
function xp(n){const o=S.lv;S.x=Math.min(MAX,S.x+n);S.lv=Math.min(10,1+Math.floor(S.x/15));$("#xpb").style.width=S.x/MAX*100+"%";$("#xpt").textContent=S.x+" / "+MAX+" XP";$("#lv").textContent=S.lv;toast("+"+n+" XP");if(S.lv>o)toast("Nível "+S.lv+" alcançado");if(S.x===MAX)toast("Nível máximo!")}
function unlock(id){if(S.got.has(id))return;S.got.add(id);$("#t-"+id).classList.add("on");toast("Troféu: "+TRO[id][1]);xp(5)}
const dim=()=>({w:W.clientWidth,h:W.clientHeight});
function setPos(x,y,d){pos.x=Math.max(3,Math.min(97,x));pos.y=Math.max(8,Math.min(96,y));P.style.transitionDuration=d+"s";P.style.left=pos.x+"%";P.style.top=pos.y+"%";check()}
function check(){const{w,h}=dim();near=null;document.querySelectorAll(".loc").forEach(b=>{const z=Z[b.dataset.k],n=Math.hypot((pos.x-z.x)*w/100,(pos.y-z.y-8)*h/100)<80;b.classList.toggle("near",n);if(n)near=b.dataset.k});
$("#hint").innerHTML=near?`<b>${Z[near].nm}</b>: pressione <b>E</b> ou toque no local para entrar.`:"Ande com <b>WASD</b> ou <b>setas</b>, clique no mapa para caminhar ou toque nos locais marcados com o losango."}
function go(k){const z=Z[k],{w,h}=dim(),d=Math.hypot((pos.x-z.x)*w/100,(pos.y-z.y-8)*h/100);setPos(z.x,z.y+8,Math.max(.15,d/320));clearTimeout(timer);timer=setTimeout(()=>open(k),d/320*1000+120)}
W.addEventListener("click",e=>{if(e.target.closest(".loc"))return;const r=W.getBoundingClientRect(),{w,h}=dim(),nx=(e.clientX-r.left)/w*100,ny=(e.clientY-r.top)/h*100;clearTimeout(timer);setPos(nx,ny,Math.hypot((nx-pos.x)*w/100,(ny-pos.y)*h/100)/320)});
function key(k){const{w,h}=dim(),s=30;if(k==="ArrowLeft"||k==="a")setPos(pos.x-s/w*100,pos.y,.12);else if(k==="ArrowRight"||k==="d")setPos(pos.x+s/w*100,pos.y,.12);else if(k==="ArrowUp"||k==="w")setPos(pos.x,pos.y-s/h*100,.12);else if(k==="ArrowDown"||k==="s")setPos(pos.x,pos.y+s/h*100,.12);else if((k==="e"||k==="Enter")&&near)open(near);else return false;return true}
addEventListener("keydown",e=>{if(!$("#ov").hidden){if(e.key==="Escape")close();return}if(e.key==="Enter"&&document.activeElement.tagName==="BUTTON")return;if(key(e.key.length===1?e.key.toLowerCase():e.key))e.preventDefault()});
document.querySelectorAll(".pad button").forEach(b=>b.onclick=()=>key(b.dataset.k));
function open(k){const z=Z[k];$("#pt").textContent=z.title;$("#pb").innerHTML=z.html();z.bind&&z.bind();$("#ov").hidden=false;$("#x").focus();document.querySelector(`.loc[data-k="${k}"]`).classList.add("done");
if(!S.seen.has(k)){S.seen.add(k);xp(20);if(S.seen.size===5)unlock("explorer");if(S.seen.size===4&&!S.seen.has("portal"))document.querySelector('.loc[data-k="portal"]').classList.add("glow")}}
function close(){$("#ov").hidden=true;W.focus({preventScroll:true})}
$("#x").onclick=close;$("#ov").onclick=e=>{if(e.target.id==="ov")close()};
check();
</script>
